spring.application.name=harms

spring.config.import=classpath:config/db.yml

spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:config/schema.sql
spring.sql.init.continue-on-error=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=HARMS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# 后台业务维护任务及跨域配置
harms.jobs.interval-ms=60000
harms.cors.allowed-origins=http://localhost:5173,http://localhost:3000
harms.initializer.fail-fast=true
harms.rate-limit.per-minute=120
server.error.include-message=never
server.error.include-stacktrace=never
